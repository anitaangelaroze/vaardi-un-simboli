<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vārdi un simboli</title>
<style>
:root{--cream:#f7f5ef;--paper:#fffefa;--ink:#263541;--muted:#637887;--line:#d8e0e3;--blue:#e8f0f3;--accent:#476879}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header{padding:22px 18px 10px;text-align:center}
h1{font-size:clamp(25px,5vw,36px);margin:0 0 8px;font-weight:700}
.subtitle{color:var(--muted);margin:0;font-size:16px}
main{max-width:1000px;margin:0 auto;padding:16px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 3px 14px #2635410a}
label{display:block;font-weight:700;margin:0 0 9px}
.toolbar{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 16px}
.group{flex:1 1 230px;min-width:0}
.btnrow{display:flex;gap:7px}
button{font:inherit;border:1px solid #bdcbd1;background:#fff;border-radius:10px;padding:10px 12px;color:var(--ink);cursor:pointer;min-height:42px}
button:focus-visible,textarea:focus-visible{outline:3px solid #9ab9c7;outline-offset:2px}
.btnrow button{flex:1;min-width:0}
button[aria-pressed="true"]{background:var(--blue);border-color:var(--accent);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.primary{background:var(--accent);color:white;border-color:var(--accent)}
.hint{font-size:14px;color:var(--muted);line-height:1.5;margin:12px 0 0}
.editor-shell{position:relative;border:1px solid #c9d6db;border-radius:14px;background:#fff;overflow:hidden}
#mirror,#textInput{font-family:Arial,Helvetica,sans-serif;font-size:22px;line-height:76px;letter-spacing:0;word-spacing:0;padding:34px 12px 14px;margin:0;width:100%;min-height:280px;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4}
#mirror{position:absolute;inset:0;pointer-events:none;color:var(--ink);overflow:hidden}
#textInput{position:relative;display:block;resize:vertical;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--ink);border:0;outline:none;overflow:auto}
#textInput::selection{background:#9ab9c777}
.mword{position:relative;display:inline;white-space:pre-wrap}
.mword .symbol{position:absolute;left:0;top:-29px;width:28px;height:28px;object-fit:contain}
#mirror.no-symbols .symbol{display:none}
.small-symbols #mirror .symbol{width:20px;height:20px;top:-21px}
.large-symbols #mirror .symbol{width:38px;height:38px;top:-39px}
.text-small #mirror,#textInput.text-small{font-size:18px}
.text-large #mirror,#textInput.text-large{font-size:28px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:18px}
@media(max-width:520px){main{padding:10px}.panel{padding:12px}#mirror,#textInput{font-size:20px;padding-left:10px;padding-right:10px} .group{flex-basis:100%}}
</style>
</head>
<body>
<header>
<h1>Vārdi un simboli</h1>
<p class="subtitle">Raksti tekstu — simboli parādīsies virs atpazītajiem vārdiem.</p>
</header>
<main>
<section class="panel" aria-label="Teksta veidotājs">
<div class="toolbar">
<div class="group">
<label>Simbolu lielums</label>
<div class="btnrow" role="group" aria-label="Simbolu lielums">
<button type="button" data-symbol="small" aria-pressed="false">Mazs</button>
<button type="button" data-symbol="medium" aria-pressed="true">Vidējs</button>
<button type="button" data-symbol="large" aria-pressed="false">Liels</button>
</div>
</div>
<div class="group">
<label>Teksta lielums</label>
<div class="btnrow" role="group" aria-label="Teksta lielums">
<button type="button" data-text="small" aria-pressed="false">Mazs</button>
<button type="button" data-text="medium" aria-pressed="true">Vidējs</button>
<button type="button" data-text="large" aria-pressed="false">Liels</button>
</div>
</div>
</div>
<label for="textInput">Tavs teksts</label>
<div class="editor-shell" id="editorShell">
<div id="mirror" aria-hidden="true"></div>
<textarea id="textInput" autocapitalize="sentences" spellcheck="false" aria-label="Raksti vai ielīmē tekstu">Kaķis sēž uz krēsla.</textarea>
</div>
<div class="actions">
<button type="button" class="primary" id="copyBtn">Kopēt tekstu</button>
<button type="button" id="printBtn">Drukāt</button>
<button type="button" id="clearBtn">Notīrīt</button>
</div>
<p class="hint">Raksti, dzēs un ielīmē tekstu parastajā teksta laukā. Tas saglabā latviešu burtus un pieturzīmes. Simboli ir prototipa piemēri, tāpēc tie vēl nav oficiālie ARASAAC simboli.</p>
</section>
</main>
<footer>Vārdi un simboli · prototips</footer>
<script>
const textInput=document.getElementById('textInput');
const mirror=document.getElementById('mirror');
const shell=document.getElementById('editorShell');
const known={
'kaķis':svg('cat'), 'kaķa':svg('cat'), 'kaķi':svg('cat'),
'sēž':svg('sit'), 'sēd':svg('sit'), 'sēdēt':svg('sit'),
'uz':svg('on'), 'zem':svg('under'), 'krēsla':svg('chair'), 'krēsls':svg('chair'),
'suns':svg('dog'), 'bumba':svg('ball'), 'māja':svg('house'), 'mamma':svg('person'),
'es':svg('person'), 'skrien':svg('run'), 'guļ':svg('sleep'), 'ēd':svg('eat'),
'lej':svg('pour'), 'dzer':svg('drink'), 'liels':svg('big'), 'mazs':svg('small'),
'aiz':svg('behind'), 'priekšā':svg('front'), 'blakus':svg('beside'), 'starp':svg('between'),
'pie':svg('near'), 'iekšā':svg('inside'), 'ārā':svg('outside')
};
function svg(kind){
const common='viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"';
const wrap=x=>`data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg ${common}>${x}</svg>`)}`;
const shapes={
cat:'<path fill="#e5b46e" stroke="#394b55" stroke-width="3" d="M14 25L12 8 27 17Q32 15 37 17L52 8 50 27Q56 40 45 48L44 57H36L34 48H28L26 57H18L20 46Q8 37 14 25Z"/><circle cx="25" cy="29" r="2.5" fill="#263541"/><circle cx="40" cy="29" r="2.5" fill="#263541"/><path d="M29 36Q32 40 35 36M32 32V36" stroke="#263541" stroke-width="2" fill="none"/>',
sit:'<circle cx="33" cy="12" r="8" fill="#efc8a4" stroke="#394b55" stroke-width="2"/><path d="M31 22L27 39 42 42 48 31M28 38L17 48 31 49M41 42L42 54H53" stroke="#587d91" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M25 23L14 35" stroke="#587d91" stroke-width="7" stroke-linecap="round"/>',
on:'<rect x="8" y="39" width="48" height="7" rx="2" fill="#8a9da5"/><rect x="17" y="18" width="30" height="20" rx="3" fill="#e7b96e" stroke="#394b55" stroke-width="2"/><path d="M32 34V7M24 15L32 7 40 15" stroke="#527f92" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
under:'<rect x="8" y="10" width="48" height="7" rx="2" fill="#8a9da5"/><rect x="17" y="29" width="30" height="20" rx="3" fill="#e7b96e" stroke="#394b55" stroke-width="2"/><path d="M32 20V56M24 48L32 56 40 48" stroke="#527f92" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
chair:'<path d="M17 10H47V36H17ZM20 36V56M44 36V56M17 37H47" stroke="#8d7156" stroke-width="6" fill="#e8d5b9" stroke-linejoin="round"/>',
dog:'<path d="M14 22L8 12 22 17Q34 12 44 20L55 15 52 31Q53 45 40 48L39 57H31L29 47H22L19 57H11L15 43Q8 33 14 22Z" fill="#d4a36c" stroke="#394b55" stroke-width="3"/><circle cx="28" cy="28" r="2.5"/><circle cx="42" cy="28" r="2.5"/>',
ball:'<circle cx="32" cy="32" r="23" fill="#e58d79" stroke="#394b55" stroke-width="3"/><path d="M12 24Q32 38 52 24M23 11Q38 31 23 53M42 12Q25 32 42 52" stroke="#fff4e4" stroke-width="3" fill="none"/>',
house:'<path d="M7 30L32 8 57 30M14 27V56H50V27" stroke="#394b55" stroke-width="3" fill="#e8d5b9"/><rect x="27" y="38" width="12" height="18" fill="#8ba8b4"/>',
person:'<circle cx="32" cy="13" r="9" fill="#efc8a4" stroke="#394b55" stroke-width="2"/><path d="M32 24V43M32 29L17 39M32 29L47 39M32 43L20 58M32 43L44 58" stroke="#587d91" stroke-width="7" stroke-linecap="round"/>',
run:'<circle cx="39" cy="12" r="7" fill="#efc8a4" stroke="#394b55" stroke-width="2"/><path d="M34 23L25 36 40 39M31 28L17 25M27 36L13 51M40 39L52 52" stroke="#587d91" stroke-width="7" stroke-linecap="round" fill="none"/>',
sleep:'<circle cx="27" cy="29" r="10" fill="#efc8a4" stroke="#394b55" stroke-width="2"/><path d="M36 36H53V50H11V43H36" fill="#8ba8b4" stroke="#394b55" stroke-width="2"/>',
eat:'<circle cx="32" cy="16" r="10" fill="#efc8a4" stroke="#394b55" stroke-width="2"/><path d="M32 27V53M32 33L45 40" stroke="#587d91" stroke-width="8" stroke-linecap="round"/><circle cx="49" cy="42" r="5" fill="#e7b96e"/>',
drink:'<path d="M19 23H46L42 54H23Z" fill="#a8d0df" stroke="#394b55" stroke-width="3"/><path d="M27 8L40 20" stroke="#587d91" stroke-width="4" stroke-linecap="round"/>',
big:'<rect x="7" y="7" width="50" height="50" rx="6" fill="#a8c3ce" stroke="#394b55" stroke-width="3"/>',
small:'<rect x="20" y="20" width="24" height="24" rx="4" fill="#e7b96e" stroke="#394b55" stroke-width="3"/>',
behind:'<rect x="9" y="28" width="25" height="25" rx="3" fill="#a8c3ce" stroke="#394b55" stroke-width="2"/><rect x="29" y="10" width="25" height="25" rx="3" fill="#e7b96e" stroke="#394b55" stroke-width="2"/>',
front:'<rect x="9" y="10" width="25" height="25" rx="3" fill="#a8c3ce" stroke="#394b55" stroke-width="2"/><rect x="29" y="28" width="25" height="25" rx="3" fill="#e7b96e" stroke="#394b55" stroke-width="2"/>',
beside:'<rect x="5" y="20" width="23" height="25" rx="3" fill="#a8c3ce" stroke="#394b55" stroke-width="2"/><rect x="36" y="20" width="23" height="25" rx="3" fill="#e7b96e" stroke="#394b55" stroke-width="2"/>',
between:'<rect x="3" y="20" width="17" height="25" rx="2" fill="#a8c3ce" stroke="#394b55" stroke-width="2"/><rect x="44" y="20" width="17" height="25" rx="2" fill="#a8c3ce" stroke="#394b55" stroke-width="2"/><rect x="24" y="20" width="17" height="25" rx="2" fill="#e7b96e" stroke="#394b55" stroke-width="2"/>',
near:'<circle cx="18" cy="32" r="10" fill="#a8c3ce" stroke="#394b55" stroke-width="2"/><circle cx="44" cy="32" r="10" fill="#e7b96e" stroke="#394b55" stroke-width="2"/>',
inside:'<rect x="8" y="8" width="48" height="48" rx="5" fill="#dce9ed" stroke="#394b55" stroke-width="3"/><circle cx="32" cy="32" r="10" fill="#e7b96e" stroke="#394b55" stroke-width="2"/>',
outside:'<rect x="8" y="8" width="48" height="48" rx="5" fill="none" stroke="#394b55" stroke-width="3" stroke-dasharray="5 4"/><circle cx="32" cy="32" r="10" fill="#e7b96e" stroke="#394b55" stroke-width="2"/>'
};
return wrap(shapes[kind]||shapes.person);
}
function render(){
const value=textInput.value;
const parts=value.match(/\s+|[^\s]+/gu)||[];
mirror.innerHTML=parts.map(part=>{
 if(/^\s+$/u.test(part)) return part.replace(/ /g,'&nbsp;').replace(/\n/g,'<br>');
 const match=part.toLocaleLowerCase('lv').match(/^[\p{L}]+/u);
 const word=match?match[0]:'';
 const icon=known[word];
 const safe=part.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 return `<span class="mword">${icon?`<img class="symbol" src="${icon}" alt="">`:''}${safe}</span>`;
}).join('');
mirror.scrollTop=textInput.scrollTop;
mirror.scrollLeft=textInput.scrollLeft;
mirror.style.height=textInput.offsetHeight+'px';
}
textInput.addEventListener('input',render);
textInput.addEventListener('scroll',()=>{mirror.scrollTop=textInput.scrollTop;mirror.scrollLeft=textInput.scrollLeft});
new ResizeObserver(()=>render()).observe(textInput);
document.querySelectorAll('[data-symbol]').forEach(b=>b.addEventListener('click',()=>{
 shell.classList.remove('small-symbols','large-symbols');
 if(b.dataset.symbol!=='medium')shell.classList.add(b.dataset.symbol+'-symbols');
 document.querySelectorAll('[data-symbol]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
}));
document.querySelectorAll('[data-text]').forEach(b=>b.addEventListener('click',()=>{
 mirror.classList.remove('text-small','text-large');textInput.classList.remove('text-small','text-large');
 if(b.dataset.text!=='medium'){mirror.classList.add('text-'+b.dataset.text);textInput.classList.add('text-'+b.dataset.text)}
 document.querySelectorAll('[data-text]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
 render();
}));
document.getElementById('copyBtn').addEventListener('click',async()=>{
 try{await navigator.clipboard.writeText(textInput.value);alert('Teksts nokopēts.')}
 catch(e){textInput.focus();textInput.select();alert('Teksts ir iezīmēts. Izvēlies Kopēt savā iPad izvēlnē.')}
});
document.getElementById('clearBtn').addEventListener('click',()=>{if(confirm('Vai tiešām notīrīt tekstu?')){textInput.value='';render();textInput.focus()}});
document.getElementById('printBtn').addEventListener('click',()=>{
 const w=window.open('','_blank');
 if(!w){window.print();return}
 w.document.write('<!doctype html><html lang="lv"><head><meta charset="utf-8"><title>Vārdi un simboli</title><style>body{font-family:Arial,sans-serif;padding:24px;color:#263541}p{font-size:22px;line-height:1.8}</style></head><body><p>'+textInput.value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')+'</p></body></html>');
 w.document.close();w.focus();w.print();
});
render();
</script>
</body></html>
